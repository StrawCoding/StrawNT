# E2E partition — upstream type:any, replace blank virtio disk.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

defaultFileSystemType: "ext4"
initialPartitioningChoice: "erase"
defaultPartitionTableType: "gpt"
userSwapChoices:
    - none

devices:
    type: any
    ignore:
      - /^loop/
      - /^fd/
      - /^sr/
      - /^zram/
      - /^nbd/
