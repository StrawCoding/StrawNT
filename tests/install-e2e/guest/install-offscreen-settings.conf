# E2E install — show pages auto-advanced by xdotool; users via shellprocess.
---
modules-search: [ local ]

instances:
- id:       partition
  module:   partition
- id:       summary
  module:   summary
- id:       unpackfs
  module:   unpackfs
- id:       packages
  module:   packages
- id:       bootloader
  module:   bootloader
- id:       e2e_user
  module:   shellprocess
  config:   shellprocess_e2e-user.conf
- id:       install_marker
  module:   shellprocess
  config:   shellprocess_install-marker.conf
- id:       finished
  module:   finished

sequence:
- show:
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@e2e_user
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - shellprocess@install_marker
  - umount
- show:
  - finished

branding: strawwu
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
