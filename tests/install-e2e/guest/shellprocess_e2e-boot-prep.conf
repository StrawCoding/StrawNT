---
dontChroot: false
timeout: 60
script:
  - command: "sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash console=ttyS0,115200n8\"/' /etc/default/grub"
  - command: "grep -q '^GRUB_TERMINAL' /etc/default/grub || printf 'GRUB_TERMINAL=\"console serial\"\nGRUB_SERIAL_COMMAND=\"serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1\"\n' >> /etc/default/grub"
  - command: "printf '[Unit]\nDescription=StrawWU E2E Boot Marker\nAfter=multi-user.target\n\n[Service]\nType=oneshot\nExecStart=/bin/sh -c \"echo STRAWWU_BOOT_OK > /dev/ttyS0\"\nExecStartPost=/bin/sh -c \"echo STRAWWU-DESKTOP-OK > /dev/ttyS0\"\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/strawwu-boot-marker.service"
  - command: "mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/strawwu-boot-marker.service /etc/systemd/system/multi-user.target.wants/strawwu-boot-marker.service"
