# E2E Calamares settings — exec-only with Python partition/mount modules.
# Single bootloader_e2e shellprocess handles: serial console, grub config,
# grub install, and kmsg marker. Avoids Calamares 3.3.5 shellprocess
# instance ordering bug (instances definition order != sequence order).
---
modules-search: [ local ]

instances:
- id:       unpackfs
  module:   unpackfs
- id:       e2e_locale
  module:   shellprocess
  config:   shellprocess_e2e-locale.conf
- id:       e2e_user
  module:   shellprocess
  config:   shellprocess_e2e-user.conf
- id:       bootloader_e2e
  module:   shellprocess
  config:   shellprocess_bootloader-e2e.conf

sequence:
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - shellprocess@e2e_locale
  - shellprocess@e2e_user
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - shellprocess@bootloader_e2e
  - umount

branding: strawwu
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
