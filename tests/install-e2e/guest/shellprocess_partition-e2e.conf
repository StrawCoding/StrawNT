---
dontChroot: true
timeout: 120
script:
  - command: "/bin/bash -c 'set -e; DEV=${STRAWWU_E2E_TARGET_DEV:-/dev/vda}; sgdisk --zap-all $DEV; sgdisk -n 1:0:+512M -t 1:ef00 -c 1:EFI $DEV; sgdisk -n 2:0:0 -t 2:8300 -c 2:root $DEV; partprobe $DEV; sleep 2; mkfs.fat -F32 ${DEV}1; mkfs.ext4 -F -L strawwu-root ${DEV}2; mkdir -p /tmp/calamares-root; mount ${DEV}2 /tmp/calamares-root; mkdir -p /tmp/calamares-root/boot/efi; mount ${DEV}1 /tmp/calamares-root/boot/efi; echo done'"
