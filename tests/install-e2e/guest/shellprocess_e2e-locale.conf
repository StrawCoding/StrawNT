---
dontChroot: false
timeout: 180
script:
  - command: "printf 'en_US.UTF-8 UTF-8\\n' > /etc/locale.gen"
  - command: "DEBIAN_FRONTEND=noninteractive locale-gen en_US.UTF-8"
  - command: "printf 'LANG=en_US.UTF-8\\n' > /etc/locale.conf"
  - command: "printf 'LANG=en_US.UTF-8\\n' > /etc/default/locale"
