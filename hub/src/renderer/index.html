<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>StrawWU Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="titlebar-brand">
        <img class="brand-icon" src="../../assets/icon.png" alt="StrawWU">
        <h1 data-i18n="app.title">StrawWU Hub</h1>
      </div>
      <div class="titlebar-meta">
        <span id="connection-indicator" class="indicator disconnected"></span>
        <span id="connection-text" data-i18n="connection.mock">Mock Mode</span>
      </div>
    </header>

    <nav class="sidebar">
      <button class="nav-btn active" data-tab="status">
        <span class="nav-icon">◉</span>
        <span data-i18n="nav.status">Subsystem Status</span>
      </button>
      <button class="nav-btn" data-tab="logs">
        <span class="nav-icon">☰</span>
        <span data-i18n="nav.logs">System Logs</span>
      </button>
      <button class="nav-btn" data-tab="updates">
        <span class="nav-icon">⟳</span>
        <span data-i18n="nav.updates">Update Channel</span>
      </button>
      <button class="nav-btn" data-tab="language">
        <span class="nav-icon">🌐</span>
        <span data-i18n="nav.language">Language</span>
      </button>
    </nav>

    <main class="content">
      <!-- Status Panel -->
      <section id="tab-status" class="tab-panel active">
        <h2 data-i18n="status.title">Subsystem Status</h2>
        <div id="status-grid" class="status-grid"></div>
        <div class="actions-bar">
          <button id="btn-refresh-status" class="btn btn-primary" data-i18n="status.refresh">Refresh</button>
        </div>
      </section>

      <!-- Logs Panel -->
      <section id="tab-logs" class="tab-panel">
        <h2 data-i18n="logs.title">System Logs</h2>
        <div class="log-controls">
          <select id="log-subsystem-filter">
            <option value="" data-i18n="logs.all_subsystems">All Subsystems</option>
            <option value="strawwu-runtime">strawwu-runtime</option>
            <option value="strawwu-bridge">strawwu-bridge</option>
            <option value="strawwu-nt">strawwu-nt</option>
            <option value="strawwu-launcher">strawwu-launcher</option>
          </select>
          <select id="log-level-filter">
            <option value="" data-i18n="logs.all_levels">All Levels</option>
            <option value="ERROR">ERROR</option>
            <option value="WARN">WARN</option>
            <option value="INFO">INFO</option>
            <option value="DEBUG">DEBUG</option>
          </select>
          <button id="btn-refresh-logs" class="btn btn-secondary" data-i18n="logs.reload">Reload</button>
        </div>
        <div id="log-container" class="log-container"></div>
      </section>

      <!-- Updates Panel -->
      <section id="tab-updates" class="tab-panel">
        <h2 data-i18n="updates.title">Update Channel</h2>
        <p class="muted-text" data-i18n="updates.description">Select the StrawWU update channel. Changes take effect on the next update check.</p>
        <div class="channel-cards">
          <label class="channel-card" data-channel="stable">
            <input type="radio" name="update-channel" value="stable">
            <div class="channel-info">
              <span class="channel-name" data-i18n="updates.stable">Stable</span>
              <span class="channel-desc" data-i18n="updates.stable_desc">Stable — fully tested official releases</span>
            </div>
            <span class="channel-badge badge-stable" data-i18n="updates.stable_badge">Recommended</span>
          </label>
          <label class="channel-card" data-channel="beta">
            <input type="radio" name="update-channel" value="beta">
            <div class="channel-info">
              <span class="channel-name" data-i18n="updates.beta">Beta</span>
              <span class="channel-desc" data-i18n="updates.beta_desc">Beta — includes upcoming new features</span>
            </div>
            <span class="channel-badge badge-beta" data-i18n="updates.beta_badge">Early Access</span>
          </label>
          <label class="channel-card" data-channel="nightly">
            <input type="radio" name="update-channel" value="nightly">
            <div class="channel-info">
              <span class="channel-name" data-i18n="updates.nightly">Nightly</span>
              <span class="channel-desc" data-i18n="updates.nightly_desc">Nightly builds — latest but may be unstable</span>
            </div>
            <span class="channel-badge badge-nightly" data-i18n="updates.nightly_badge">Developer</span>
          </label>
        </div>
        <div id="channel-status" class="channel-status"></div>
      </section>

      <!-- Language Panel -->
      <section id="tab-language" class="tab-panel">
        <h2 data-i18n="language.title">Language</h2>
        <p class="muted-text" data-i18n="language.description">Select the display language for StrawWU Hub.</p>
        <div class="language-search-bar">
          <input type="text" id="language-search" class="language-search-input" data-i18n-placeholder="language.search" placeholder="Search languages...">
        </div>
        <div id="language-list" class="language-list"></div>
        <div id="language-status" class="channel-status"></div>
      </section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
