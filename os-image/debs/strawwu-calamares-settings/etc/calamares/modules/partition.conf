# Upstream-style partition (calamares type:any) — QEMU virtio /dev/vda compatible.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

defaultFileSystemType: "ext4"
# C8: no pre-selected erase/replace — user must pick (alongside shown when OS detected).
initialPartitioningChoice: none
defaultPartitionTableType: "gpt"
userSwapChoices:
    - none

# C7: LUKS full-disk / partition encryption (GRUB cryptodisk + initramfs unlock).
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
createHybridBootloaderLayout: true

devices:
    type: any
    ignore:
      - /^loop/
      - /^fd/
      - /^sr/
      - /^zram/
      - /^nbd/
