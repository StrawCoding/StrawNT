# StrawWU installer — upstream-style module order with exec phase (see calamares SOP).
---
modules-search: [ local ]

instances:
- id:       welcome
  module:   welcome
- id:       locale
  module:   locale
- id:       keyboard
  module:   keyboard
- id:       partition
  module:   partition
- id:       users
  module:   users
- id:       summary
  module:   summary
- id:       unpackfs
  module:   unpackfs
- id:       packages
  module:   packages
- id:       bootloader
  module:   bootloader
- id:       target_setup
  module:   shellprocess
  config:   shellprocess_target-setup.conf
- id:       target_identity
  module:   shellprocess
  config:   shellprocess_target-identity.conf
- id:       disable_upstream_init
  module:   shellprocess
  config:   shellprocess_disable-upstream-init.conf
- id:       install_marker
  module:   shellprocess
  config:   shellprocess_install-marker.conf
- id:       initramfs_resolute
  module:   shellprocess
  config:   shellprocess_initramfs-resolute.conf
- id:       dualboot_detect
  module:   shellprocess
  config:   shellprocess_dualboot-detect.conf
- id:       finished
  module:   finished

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - shellprocess@initramfs_resolute
  - shellprocess@dualboot_detect
  - grubcfg
  - bootloader
  - packages
  - shellprocess@target_setup
  - shellprocess@target_identity
  - shellprocess@disable_upstream_init
  - shellprocess@install_marker
  - umount
- show:
  - finished

branding: strawwu

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
