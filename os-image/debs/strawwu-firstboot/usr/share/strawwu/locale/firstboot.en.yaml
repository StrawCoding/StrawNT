strings:
  app_title: "StrawWU Setup"
  step_welcome_title: "Welcome to StrawWU"
  step_welcome_body: "This short wizard helps you finish setup after installation. You can change these options later in StrawWU Settings."
  step_language_title: "Display language"
  step_language_body: "Choose your preferred interface language. Traditional Chinese and English are supported in v0.5."
  locale_zh_tw: "Traditional Chinese (Taiwan)"
  locale_en_us: "English (United States)"
  step_privacy_title: "Privacy & terms"
  step_privacy_body: "Review our privacy policy and end-user license. Diagnostic upload and usage statistics stay off unless you opt in below."
  link_privacy: "Privacy policy"
  link_eula: "End-user license"
  opt_bug_upload: "Allow anonymous bug-report bundle upload when I choose to report a problem (default off)"
  opt_analytics: "Share optional usage statistics to improve StrawWU (default off)"
