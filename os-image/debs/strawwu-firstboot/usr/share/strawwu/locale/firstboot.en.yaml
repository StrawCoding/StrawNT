  step_flathub_body: "StrawWU uses Flathub for many desktop apps. Apps are maintained by third parties, not StrawWU. Browse and install from the Hub Flathub tab."
  step_desktop_title: "Desktop & Windows compatibility"
  step_desktop_body: "StrawWU Hub is your control center for apps, updates, and Windows compatibility mode. Step 5 introduces the Windows compat overview — full launcher integration ships in later waves."
  step_finish_title: "You're ready"
  step_finish_body: "Setup is complete. Enjoy StrawWU — browse, work, and explore Flathub apps from the Hub."
