schema: strawwu-initramfs-hooks-manifest/v1
wave: W8-S4
description: >-
  Installed-target initramfs-tools hooks: strip casper/live-boot live-media
  generators and enforce BOOT=local disk boot. Complements ISO initrd splice
  (strawwu-live-init / strawwu-live-bottom). target-identity regenerates
  initramfs after this package applies during Calamares target_setup.

disk_boot:
  conf_dropin: /etc/initramfs-tools/conf.d/strawwu-disk-boot
  boot_mode: local

strip_paths:
  hooks:
    - /usr/share/initramfs-tools/hooks/casper
    - /usr/share/initramfs-tools/hooks/live-boot
  conf:
    - /usr/share/initramfs-tools/conf.d/casper
    - /etc/initramfs-tools/conf.d/casper
  script_globs:
    - /usr/share/initramfs-tools/scripts/casper*
    - /usr/share/initramfs-tools/scripts/live*

lifecycle_key: lifecycle.initramfs_hooks
log_path: /var/log/strawwu/initramfs-hooks.log
marker_path: /var/lib/strawwu/setup/initramfs-hooks.ok
error_code: SWU-IN-005
