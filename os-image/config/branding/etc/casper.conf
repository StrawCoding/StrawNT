# StrawWU live session — keep ubuntu username for casper compatibility (ID in os-release stays ubuntu).
# FLAVOUR must be non-empty or casper overrides USERNAME from .disk/info ("StrawWU…").
export USERNAME="ubuntu"
export USERFULLNAME="Live session user"
export HOST="strawwu"
export BUILD_SYSTEM="StrawWU"
export FLAVOUR="StrawWU"
