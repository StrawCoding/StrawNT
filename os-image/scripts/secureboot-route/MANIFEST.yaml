schema: strawwu-secureboot-route/v1
stage: post-sec-secureboot-route
enforced_default: false
boot_chain:
  - uefi_firmware
  - shim.efi
  - grubx64.efi
  - vmlinuz(mok-signed)
  - initrd.img
scripts:
  sign: sign-boot-artifacts.sh
  verify: verify-boot-chain.sh
signing:
  dry_run_default: true
  sign_env: STRAWWU_SB_SIGN
  tools:
    - sbsign
    - sbverify
  # Single MOK track: shim/grub stay Canonical-signed, only the kernel is
  # MOK-signed; initrd is hash-recorded (measured via the signed kernel).
  artifacts:
    - vmlinuz
keys:
  mok: StrawWU-MOK
doc: docs/plans/kickoff/POST-SEC-secureboot-route.md
