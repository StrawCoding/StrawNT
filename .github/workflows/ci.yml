name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 preflight
        run: make test-phase0 && make preflight

  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require VERSION bump when sources change
        run: bash scripts/check-version-bump.sh
