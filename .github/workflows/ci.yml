name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 preflight
        run: make test-phase0 && make preflight

  perf-legal-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PERF1 advisory + LEG4 trademark/compliance gate
        run: make test-perf-baseline && make test-legal-trademark

  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require VERSION bump when sources change
        run: bash scripts/check-version-bump.sh

  wincompat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Wincompat component tests
        run: make test-wincompat

  calamares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calamares static preflight gate
        run: make validate-calamares-preflight
