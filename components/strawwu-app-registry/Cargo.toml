[package]
name = "strawwu-app-registry"
version.workspace = true
edition.workspace = true
description = "StrawWU user app registry — list/register/remove with schema validation"
license.workspace = true
[[bin]]
name = "strawwu-app-registry"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
