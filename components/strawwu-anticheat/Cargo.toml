[package]
name = "strawwu-anticheat"
version.workspace = true
edition.workspace = true
description = "StrawNT anti-cheat compatibility matrix — EAC/BattlEye/Vanguard probe + honesty grades"
license.workspace = true
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strawwu-bridge = { path = "../strawwu-bridge" }

[[bin]]
name = "anticheat-substantive-verify"
path = "src/bin/substantive_verify.rs"

[dev-dependencies]
