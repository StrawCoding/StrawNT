[package]
name = "strawwu-anticheat"
version = "0.4.0"
edition = "2021"
description = "StrawWU anti-cheat compatibility matrix — EAC/BattlEye/Vanguard probe stubs"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strawwu-bridge = { path = "../strawwu-bridge" }

[[bin]]
name = "anticheat-substantive-verify"
path = "src/bin/substantive_verify.rs"

[dev-dependencies]
