[package]
name = "strawwu-runtime"
version = "0.4.0"
edition = "2021"
description = "StrawWU runtime orchestrator — SubsystemSession, process graph, workload scheduling"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strawwu-bridge = { path = "../strawwu-bridge" }
strawwu-nt = { path = "../strawwu-nt" }
strawwu-graphics = { path = "../strawwu-graphics" }

[[bin]]
name = "golden-apps-verify"
path = "src/bin/golden_apps_verify.rs"

[dev-dependencies]
