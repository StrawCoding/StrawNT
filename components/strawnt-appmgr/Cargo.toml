[package]
name = "strawnt-appmgr"
version.workspace = true
edition.workspace = true
description = "StrawNT system App Manager: install/list/launch/prefix/deps/permissions/catalog (NTW5)"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
