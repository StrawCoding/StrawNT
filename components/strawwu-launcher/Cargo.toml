[package]
name = "strawwu-launcher"
version.workspace = true
edition.workspace = true
description = "StrawWU PE/ELF launcher skeleton — binary format detection and dispatch"
license.workspace = true
[[bin]]
name = "strawnt"
path = "src/main.rs"

# Deprecated compat alias — primary CLI is strawnt.
[[bin]]
name = "strawwu"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strawwu-bridge = { path = "../strawwu-bridge" }
strawwu-runtime = { path = "../strawwu-runtime" }
strawwu-app-registry = { path = "../strawwu-app-registry" }
strawwu-cli = { path = "../strawwu-cli" }
strawwu-nt = { path = "../strawwu-nt" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
